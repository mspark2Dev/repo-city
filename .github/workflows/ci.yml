name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyzer:
    name: analyzer (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analyzer
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/analyzer/uv.lock

      - run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

  web:
    name: web (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two LTS lines README claims support for. Node 20 is out: pnpm 11 needs 22.13.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter web exec tsc --noEmit

      - name: Build
        run: pnpm --filter web build

  schema:
    name: schema is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/analyzer/uv.lock

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
        working-directory: services/analyzer

      # schema.py is the single source of truth; the generated files are committed so the
      # web app builds without Python. Regenerating must be a no-op.
      - name: Regenerate types
        run: pnpm gen:types

      - name: Fail if the generated files drifted
        run: git diff --exit-code -- apps/web/citymap.schema.json apps/web/src/api/types.gen.ts
