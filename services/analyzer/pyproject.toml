[project]
name = "repocity-analyzer"
version = "0.1.0"
description = "Static analysis backend for repoCity: parses a repository into a CityMap"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
    "pathspec>=0.12",
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[project.scripts]
repocity = "repocity.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "httpx2>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["repocity"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
